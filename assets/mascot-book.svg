    <ellipse cx="316" cy="151" rx="9" ry="14" fill="#173f63" stroke="none"/>
    <path d="M245 177 Q270 201 295 180" fill="none" stroke-width="7"/>
    <ellipse cx="191" cy="172" rx="17" ry="9" fill="#f4a8b8" stroke="none"/>
    <ellipse cx="348" cy="179" rx="17" ry="9" fill="#f4a8b8" stroke="none"/>
    <path d="M271 224 l12 -18 12 18 21 3 -16 14 4 21 -21 -11 -19 11 3 -21 -16 -14z" fill="#ffd66e" stroke="#c28d2c" stroke-width="5"/>
    <!-- Open book -->
    <path d="M214 267 Q251 247 280 268 L280 326 Q245 308 214 330 Z" fill="#fff7d9" stroke="#397eaa" stroke-width="5"/>
    <path d="M280 268 Q312 248 349 266 L349 328 Q314 309 280 326 Z" fill="#e4f5ff" stroke="#397eaa" stroke-width="5"/>
    <path d="M280 268 L280 326" fill="none" stroke-width="4"/>
    <path d="M230 285 Q250 278 264 286 M230 299 Q250 292 264 300 M295 284 Q317 277 335 285 M295 298 Q317 291 335 299" fill="none" stroke="#78b9dc" stroke-width="4"/>
  </g>
  <!-- Water drop friend -->
  <g filter="url(#shadow)" stroke="#3c8fbd" stroke-width="6" stroke-linejoin="round">
    <path d="M77 63 C77 63 35 112 35 143 A42 42 0 0 0 119 143 C119 112 77 63 77 63Z" fill="#aee4ff"/>
    <ellipse cx="65" cy="139" rx="5" ry="8" fill="#17466d" stroke="none"/><ellipse cx="91" cy="139" rx="5" ry="8" fill="#17466d" stroke="none"/>
    <path d="M68 157 Q78 168 89 157" fill="none" stroke-width="4"/>
  </g>
  <!-- Oil drop friend -->
  <g filter="url(#shadow)" stroke="#c28d2c" stroke-width="6" stroke-linejoin="round">
    <path d="M505 55 C505 55 462 108 462 139 A43 43 0 0 0 548 139 C548 108 505 55 505 55Z" fill="#ffe09b"/>
    <ellipse cx="492" cy="137" rx="5" ry="8" fill="#604b2c" stroke="none"/><ellipse cx="518" cy="137" rx="5" ry="8" fill="#604b2c" stroke="none"/>
    <path d="M494 155 Q505 165 517 155" fill="none" stroke-width="4"/>
  </g>
  <!-- Molecule bubbles -->
