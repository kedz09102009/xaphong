    <circle cx="448" cy="322" r="18"/><circle cx="490" cy="285" r="18"/><circle cx="535" cy="328" r="18"/><circle cx="574" cy="288" r="18"/>
  </g>
  <g fill="#ffd66e" stroke="#fff" stroke-width="5"><path d="M134 35 l7 14 16 2 -12 10 3 16 -14 -8 -14 8 3 -16 -12 -10 16 -2z"/><path d="M418 81 l6 12 13 2 -10 9 2 13 -11 -6 -11 6 2 -13 -10 -9 13 -2z"/><path d="M579 185 l5 10 12 2 -9 8 2 12 -10 -5 -10 5 2 -12 -9 -8 12 -2z"/></g>
