<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 430" role="img" aria-labelledby="title desc">
  <title id="title">Soap and friends</title><desc id="desc">Soap mascot holding a little book, accompanied by a water drop, an oil drop, and a molecule friend.</desc>
  <defs>
