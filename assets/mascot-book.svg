    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a6e0ff"/><stop offset="1" stop-color="#4aa8e0"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="9" stdDeviation="7" flood-color="#4389b3" flood-opacity=".2"/></filter>
  </defs>
  <g filter="url(#shadow)" stroke="#17466d" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
